name: Publicar Auto-Pobre Racing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pista_interlagos/teste/package-lock.json
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar a dependencia fixada no lock
        run: npm ci --prefix pista_interlagos/teste --ignore-scripts --no-audit --no-fund
      - name: Verificar as preferencias do jogador
        run: node pista_interlagos/scripts/testar_preferencias.mjs
      - name: Verificar audio e contatos dos carros
        run: |
          node pista_interlagos/scripts/testar_audio.mjs
          node pista_interlagos/scripts/testar_eventos_audio.mjs
          node pista_interlagos/scripts/testar_colisoes.mjs
          node pista_interlagos/scripts/testar_saldo.mjs
          node pista_interlagos/scripts/testar_imersivo.mjs
          node pista_interlagos/scripts/testar_voltas.mjs
          node pista_interlagos/scripts/testar_derrapadas.mjs
          node pista_interlagos/scripts/testar_terreno_rivais.mjs
          node pista_interlagos/scripts/testar_aderencia.mjs
          node pista_interlagos/scripts/testar_direcao.mjs
      - name: Gerar somente os arquivos publicos
        run: python pista_interlagos/scripts/preparar_publicacao.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Enviar o jogo para publicacao
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
